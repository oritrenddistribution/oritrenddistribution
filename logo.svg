<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#1a1a1a" stroke="#ff8c00" stroke-width="4"/>
  
  <!-- Music Note 1 -->
  <g transform="translate(70, 60)">
    <ellipse cx="0" cy="25" rx="8" ry="12" fill="#ff8c00"/>
